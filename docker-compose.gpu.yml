# Optional NVIDIA GPU acceleration for Ollama.
# Requires: Docker with NVIDIA Container Toolkit
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
#
# Usage (any OS with NVIDIA + toolkit):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# macOS / CPU-only machines: do NOT use this file — default compose is enough.

services:
  ollama:
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
