<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Career OS Autofill</title>
  <style>
    :root {
      --background: #09090b;
      --card: #18181b;
      --card-border: #27272a;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-foreground: #ffffff;
      --secondary: #27272a;
      --secondary-hover: #3f3f46;
      --secondary-foreground: #fafafa;
      --destructive: #ef4444;
      --destructive-hover: #dc2626;
      --text: #fafafa;
      --muted: #a1a1aa;
      --input-bg: #09090b;
      --input-border: #27272a;
      --focus-ring: #3b82f6;
      --success: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 360px;
      margin: 0;
      padding: 0;
      color: var(--text);
      background: var(--background);
      -webkit-font-smoothing: antialiased;
    }

    .header {
      padding: 16px;
      background: var(--card);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 24px;
      height: 24px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
    }

    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    p.subtitle { font-size: 12px; color: var(--muted); margin: 0; }

    .content {
      padding: 16px;
    }

    .section {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text);
    }

    input[type="text"], input[type="password"], input[type="email"] {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      font-size: 13px;
      color: var(--text);
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--focus-ring);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
      font-size: 12px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--primary); color: var(--primary-foreground); }
    .btn-primary:hover { background: var(--primary-hover); }
    
    .btn-secondary { background: var(--secondary); color: var(--secondary-foreground); border: 1px solid var(--card-border); }
    .btn-secondary:hover { background: var(--secondary-hover); }
    
    .btn-destructive { background: var(--destructive); color: var(--primary-foreground); }
    .btn-destructive:hover { background: var(--destructive-hover); }

    .status-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
      line-height: 1.4;
    }

    .status-box.show { display: block; }
    .status-ok { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: var(--success); }
    .status-err { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5; }

    details {
      margin-bottom: 12px;
      font-size: 12px;
    }
    
    summary {
      cursor: pointer;
      color: var(--muted);
      margin-bottom: 8px;
      user-select: none;
    }

    summary:hover { color: var(--text); }

    /* Custom Checkbox */
    input[type="checkbox"] {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    
    .loading-spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .is-loading .loading-spinner { display: inline-block; }
    .is-loading .btn-text { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">OS</div>
    <div>
      <h1>Career OS Auto-Fill</h1>
      <p class="subtitle">AI-Powered Job Applications</p>
    </div>
  </div>

  <div class="content">
    <div id="loginSection" class="section">
      <label for="apiBase">API Endpoint</label>
      <input id="apiBase" type="text" placeholder="http://localhost:8001/api/v1" />
      
      <label for="email">Account Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />
      
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      
      <button class="btn-primary" id="login">
        <div class="loading-spinner"></div>
        <span class="btn-text">Log in & Sync Data</span>
      </button>

      <details>
        <summary>Advanced: Paste JWT manually</summary>
        <input id="token" type="password" placeholder="Bearer Token" />
        <button class="btn-secondary" id="save">Save Token</button>
      </details>
    </div>

    <div id="actionSection" class="section" style="display: none;">
      <div class="row">
        <input id="consent" type="checkbox" />
        <label for="consent" style="margin:0; cursor:pointer;">
          Enable Auto-Submit (Caution)
        </label>
      </div>
      <p style="font-size: 11px; color: var(--muted); margin-top: -4px; margin-bottom: 12px; line-height: 1.4;">
        If checked, AI will automatically submit the application if confidence is high. Otherwise, it only fills the fields.
      </p>

      <button class="btn-primary" id="fill">
        <div class="loading-spinner"></div>
        <span class="btn-text">Fill Fields (Review Mode)</span>
      </button>
      
      <button class="btn-destructive" id="auto">
        <div class="loading-spinner"></div>
        <span class="btn-text">Fill + Auto-Submit</span>
      </button>
      
      <button class="btn-secondary" id="test">
        <div class="loading-spinner"></div>
        <span class="btn-text">Verify Connection</span>
      </button>

      <button class="btn-secondary" id="logout" style="margin-top: 16px;">
        <span class="btn-text">Logout</span>
      </button>
    </div>

    <div id="status" class="status-box"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
