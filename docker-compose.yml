services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aijobdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Local OpenAI-compatible LLM (free, no cloud credits).
  # After first start, pull a model (CPU works; GPU optional — see docker-compose.gpu.yml):
  #   docker compose exec ollama ollama pull qwen2.5:3b
  # Prefer qwen2.5:3b on modest machines. 7b needs more RAM.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Hot-reload against bind-mounted source (Python packages stay in the image)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      # Put your base resumes (PDF/DOCX/MD) in ./data/resumes on the host
      - ./data/resumes:/data/resumes
      - ./data/packages:/data/packages
      # Obsidian second brain — replace with Jay OS path on Windows if desired:
      # - "C:/Users/Asus/OneDrive/Desktop/Jay OS:/data/obsidian"
      - ./data/obsidian:/data/obsidian
    environment:
      # Docker DNS names (override localhost values from backend/.env)
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/aijobdb
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_TIMEOUT_SECONDS: "300"
      OLLAMA_MAX_TOKENS: "400"
      # LLM_PROVIDER comes from backend/.env (tokenharbor | ollama | openai)
      LLM_FORCE_MOCK: "false"
      LLM_ALLOW_MOCK: "false"
      JOB_DISCOVERY_SOURCES: vault_portals,remotive,remoteok,arbeitnow
      JOB_DISCOVERY_PER_SOURCE: "3"
      JOB_DISCOVERY_VAULT_LIMIT: "12"
      JOB_DISCOVERY_MAX_RESULTS: "15"
      RESUME_SOURCE_DIR: /data/resumes
      APPLICATION_PACKAGE_DIR: /data/packages
      OBSIDIAN_VAULT_PATH: /data/obsidian
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      CHECKPOINT_BACKEND: postgres
    env_file:
      - ./backend/.env
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
      - qdrant
      - ollama
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
