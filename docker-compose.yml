services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aijobdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Local OpenAI-compatible LLM (free, no cloud credits)
  # Pull a model after first start:
  #   docker compose exec ollama ollama pull qwen2.5:3b
  #   docker compose exec ollama ollama pull nomic-embed-text
  # Prefer qwen2.5:3b on 4GB GPUs (e.g. GTX 1650 Ti). 7b often spills to CPU.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Keep the active model resident between agent calls (avoids ~8s reload each time)
      OLLAMA_KEEP_ALIVE: "-1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    # Docker Desktop + NVIDIA Container Toolkit
    gpus: all
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
