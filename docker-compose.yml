services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aijobdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Local OpenAI-compatible LLM (free, no cloud credits)
  # Pull a model after first start:
  #   docker compose exec ollama ollama pull qwen2.5:3b
  #   docker compose exec ollama ollama pull nomic-embed-text
  # Prefer qwen2.5:3b on 4GB GPUs (e.g. GTX 1650 Ti). 7b often spills to CPU.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Keep the active model resident between agent calls (avoids ~8s reload each time)
      OLLAMA_KEEP_ALIVE: "-1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    # Docker Desktop + NVIDIA Container Toolkit
    gpus: all
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Hot-reload against bind-mounted source (packages stay in the image — no local venv)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      # Host resume library ↔ container (packages written back to your Downloads folder)
      - "C:\\Users\\Asus\\Downloads\\resume based on JD:/data/resumes"
      - "./data/packages:/data/packages"
    environment:
      # Docker DNS names (override localhost values from backend/.env)
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/aijobdb
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_TIMEOUT_SECONDS: "180"
      OLLAMA_MAX_TOKENS: "400"
      RESUME_SOURCE_DIR: /data/resumes
      APPLICATION_PACKAGE_DIR: /data/packages
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      CHECKPOINT_BACKEND: postgres
    env_file:
      - ./backend/.env
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
      - qdrant
      - ollama
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
